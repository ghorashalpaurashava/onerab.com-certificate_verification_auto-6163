<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - Ghorashal Municipality</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            margin-top: 70px;
            border: 3px solid #28a745;
        }
        .logo-placeholder {
            width: 90px;
            height: 90px;
            background-color: #fff;
            border-radius: 50%;
            border: 4px solid #dc3545;
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .approved-text {
            color: #28a745;
            font-size: 24px;
            font-weight: bold;
            margin-top: 35px;
            text-transform: uppercase;
            line-height: 1.2;
        }
        .municipality-text {
            color: #111;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .divider {
            border: 0;
            border-top: 1.5px dotted #8b0000;
            margin: 15px auto;
            width: 70%;
        }
        .details-title {
            color: #8b0000;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        .details-container {
            text-align: left;
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.6;
            padding: 0 10px;
        }
        .details-container p {
            margin: 15px 0;
            color: #111;
        }
        .details-container strong {
            color: #111;
            font-weight: bold;
        }
        .footer-text {
            color: #28a745;
            font-size: 15px;
            font-style: italic;
            font-weight: bold;
            margin-top: 35px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-placeholder">
            <img src="logo.png" alt="Municipality Logo">
        </div>

        <div class="approved-text">
            THIS CERTIFICATE IS<br>
            APPROVED<br>
            BY
        </div>
        <div class="municipality-text">
            GHORASHAL MUNICIPALITY
        </div>

        <hr class="divider">
        <div class="details-title">----Certificate Details----</div>

        <div class="details-container">
            <p><strong>Name:</strong> মোসাঃ ঝুমুর</p>
            <p><strong>Father/Husband Name:</strong> মোঃ জহির</p>
            <p><strong>District:</strong> Narsingdi</p>
            <p><strong>Country:</strong> Bangladesh</p>
        </div>

        <div class="footer-text">
            100% authentic certificate!
        </div>
    </div>

</body>
</html>
